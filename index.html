<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan-O-Mart</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <header>
    <h1>🛒 Scan-O-Mart 🛒</h1>
    <button id="shuffle" type="button">🔄 New groceries</button>
  </header>

  <main>
    <section id="belt" aria-label="Checkout conveyor belt">
      <div id="lane"></div>
      <div id="customer" aria-hidden="true">🙂</div>
    </section>

    <aside id="register">
      <div id="printer"><div class="slot"></div></div>
      <div id="display" class="idle">
        <div id="item-name">Scan something!</div>
        <div id="item-price">$0.00</div>
      </div>
      <h2>Receipt</h2>
      <ol id="receipt"></ol>
      <div id="total-row">
        <span>TOTAL</span><span id="total">$0.00</span>
      </div>
      <button id="clear" type="button">🧾 Pay &amp; print receipt</button>
    </aside>
  </main>

  <div id="rickroll" hidden>
    <div class="banner">🎵 SPECIAL DEAL! 🎵</div>
    <div class="video-wrap" id="video-wrap"></div>
    <div id="sound-hint" hidden>🔊 Scan or tap for sound!</div>
    <button id="close-rick" type="button">✖ Back to shopping</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
